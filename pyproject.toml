[project]
name = "carburants"
version = "0.1.0"
description = "Transmission du prix du pétrole aux prix à la pompe en France (ENSAE 2A)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pyyaml>=6.0.4",
]
